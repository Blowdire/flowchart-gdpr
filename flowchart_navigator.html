<title>GDPR Flowchart Navigator</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
body { font-family: sans-serif; margin: 0; padding: 24px; background: #f8f9fa; color: #222; }
h1 { font-size: 1.3em; margin: 0 0 20px; color: #333; }
#cards { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 16px; }
.card {
    border: 2px solid rgba(0,0,0,.15); border-radius: 10px; padding: 16px;
    min-width: 240px; max-width: 480px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.card-title { font-size: 1em; font-weight: bold; margin-bottom: 3px; }
.card-meta  { font-size: .75em; color: #444; margin-bottom: 12px; }
.clist { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.citem {
    display: block; width: 100%; padding: 9px 13px;
    border: 1px solid #ccc; border-radius: 6px; background: #f5f5f5;
    cursor: pointer; font-size: .87em; text-align: left; font-family: inherit;
    transition: background .12s, border-color .12s;
}
.citem:hover  { background: #e8e8e8; }
.citem.active { background: #d4edda; border-color: #5cb85c; font-weight: 600; }
.status       { font-size: .84em; margin: 7px 0; }
.status.met   { color: #1a7a3a; font-weight: bold; }
.status.unmet { color: #888; }
.terminal     { color: #1a7a3a; font-weight: bold; margin-top: 8px; font-size: .9em; }
.yesno        { display: flex; gap: 8px; margin-top: 10px; }
.btn {
    padding: 7px 18px; border-radius: 6px; border: none; cursor: pointer;
    font-size: .9em; font-family: inherit; font-weight: 500;
    transition: opacity .12s, transform .08s;
}
.btn:disabled              { opacity: .35; cursor: default; }
.btn:not([disabled]):hover  { opacity: .85; }
.btn:not([disabled]):active { transform: scale(.97); }
.btn-yes     { background: #28a745; color: #fff; }
.btn-no      { background: #dc3545; color: #fff; }
.btn-proceed { background: #28a745; color: #fff; margin-top: 10px; }
.btn-proceed[disabled] { background: #aaa; }
.btn-next    { background: #007bff; color: #fff; }
.btn-restart { background: #ffc107; color: #333; }
#controls    { display: flex; gap: 10px; align-items: center; }
.done        { color: #1a7a3a; font-weight: bold; }
</style>
</head>

994", "label": "You are obliged to maintain RoPA\n", "shape_type": "Shape", "color": "#e5b9b5", "mp_name": "Decision", "reverse_engineering_type": "Conditions to respect Node", "x": 132.7805161417323, "y": 21.82547677165353}, "997": {"id": "997", "label": "The processing is not occasional\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 133.7713992125984, "y": 24.95432677165353}, "998": {"id": "998", "label": "The processing includes special categories of data\u00a0or personal data relating to criminal convictions and offences\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 136.1395992125984, "y": 24.95432677165353}, "1005": {"id": "1005", "label": "Yes\n", "shape_type": "Shape", "color": "#9dbb61", "mp_name": "Process", "reverse_engineering_type": "Yes Node", "x": 132.3773661417323, "y": 23.13202677165354}, "1006": {"id": "1006", "label": "No\n", "shape_type": "Shape", "color": "#c05046", "mp_name": "Process", "reverse_engineering_type": "No Node", "x": 134.9539661417323, "y": 23.12172677165354}, "1007": {"id": "1007", "label": "IF\n", "shape_type": "Shape", "color": "#eeeaf2", "mp_name": "Start/End", "reverse_engineering_type": "IF collector node", "x": 133.7713992090222, "y": 23.75712676950776}, "1018": {"id": "1018", "label": "You are not obliged to maintain RoPA\n", "shape_type": "Shape", "color": "#b7dde8", "mp_name": "Decision", "reverse_engineering_type": "Termination Node", "x": 134.8498161417323, "y": 21.82547677165353}, "1023": {"id": "1023", "label": "Information is provided\u00a0in a concise, transparent, intelligible and easily accessible form\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 9.483666141732272, "y": 18.34271338582678}, "1025": {"id": "1025", "label": "Information is provided using clear and plain language\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 9.47876614173228, "y": 17.00331338582677}, "1028": {"id": "1028", "label": "The information is provided in writing, or by other means, including, where appropriate, by electronic means\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 9.483699212598395, "y": 15.62182677165354}, "1034": {"id": "1034", "label": "Information provided without undue delay and in any event within one month of the receipt of the request (for rights established in Art.15-22)\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 12.9531, "y": 13.44092677165354}, "1035": {"id": "1035", "label": "\u00a0When personal data are collected from the data subject\u00a0information about data processing is provided at the time when personal data are obtained\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 9.3827, "y": 13.48312677165354}, "1036": {"id": "1036", "label": "When personal data have not been obtained from the data subject\u00a0information about data processing is provided:\u00a0\n- within a reasonable period after obtaining the personal data, but at the latest within one month, having regard to the specific circumstances in which the personal data are processed; or\n- if the personal data are to be used for communication with the data subject, at the latest at the time of the first communication to that data subject; or\n-if a disclosure to another recipient is envisaged, at the latest when the personal data are first disclosed.\u00a0\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 4.0004, "y": 13.48302677165354}, "1044": {"id": "1044", "label": "If you do not act on the data subject\u2019s request, you must, without delay and no later than one month after receipt, inform the data subject of the reasons and of their right to lodge a complaint with a supervisory authority and seek a judicial remedy.\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 16.6626, "y": 15.15982677165354}, "1047": {"id": "1047", "label": "Information is generally provided free of charge.\u00a0Where a data subject\u2019s requests are manifestly unfounded or excessive, particularly because they are repetitive, you may either charge a reasonable fee based on the administrative costs of providing the information or taking the requested action, or refuse to act on the request. You\u00a0bear the burden of demonstrating the manifestly unfounded or excessive character of the request.\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 9.3818, "y": 10.59012677165355}, "1051": {"id": "1051", "label": "The following depends on the specific right applicable / request provided by\u00a0 a data subject - not all rights have to be evaluated in each request\n", "shape_type": "Shape", "color": "#f2f2f2", "mp_name": "Custom 4", "reverse_engineering_type": "unknown", "x": 71.6175, "y": 24.7466}, "1054": {"id": "1054", "label": "Right to be informed\n", "shape_type": "Shape", "color": "#cf4c9f", "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 25.2193, "y": 17.13171338582678}, "1055": {"id": "1055", "label": "Right of access\n", "shape_type": "Shape", "color": "#cf4c9f", "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 36.0466661417323, "y": 17.13162677165354}, "1056": {"id": "1056", "label": "Right to rectification\n", "shape_type": "Shape", "color": "#cf4c9f", "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 41.4742661417323, "y": 17.29922677165354}, "1057": {"id": "1057", "label": "Right to be forgotten\n", "shape_type": "Shape", "color": "#cf4c9f", "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 49.36736614173231, "y": 17.34892677165355}, "1058": {"id": "1058", "label": "Right to restriction of processing\n", "shape_type": "Shape", "color": "#cf4c9f", "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 61.27726614173231, "y": 17.29921338582678}, "1059": {"id": "1059", "label": "Right to data portability\n", "shape_type": "Shape", "color": "#cf4c9f", "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 71.66476614173229, "y": 17.29931338582677}, "1060": {"id": "1060", "label": "Right to object\n", "shape_type": "Shape", "color": "#cf4c9f", "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 77.6763992125984, "y": 17.26062677165354}, "1061": {"id": "1061", "label": "Right to not to be\u00a0subject to a decision based solely on automated processing, including profiling\n", "shape_type": "Shape", "color": "#cf4c9f", "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 83.67606614173229, "y": 17.01061338582677}, "1113": {"id": "1113", "label": "Where do you obtain personal data from?\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 25.21926614173228, "y": 15.36702677165354}, "1116": {"id": "1116", "label": "Directly from data subject\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 21.53196614173228, "y": 13.94612677165354}, "1117": {"id": "1117", "label": "Not directly from data subject\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 27.94966614173228, "y": 13.92342677165354}, "1123": {"id": "1123", "label": "Does the data subject already has information about data processing?\n", "shape_type": "Shape", "color": "#fff2cc", "mp_name": "Process", "reverse_engineering_type": "Question Node", "x": 21.53196614173228, "y": 12.12152677165354}, "1125": {"id": "1125", "label": "No\n", "shape_type": "Shape", "color": "#c05046", "mp_name": "Process", "reverse_engineering_type": "No Node", "x": 22.57546614173228, "y": 10.95971338582678}, "1126": {"id": "1126", "label": "Yes\n", "shape_type": "Shape", "color": "#9dbb61", "mp_name": "Process", "reverse_engineering_type": "Yes Node", "x": 20.13316614173226, "y": 10.95970580675601}, "1132": {"id": "1132", "label": "Information to data subjects does not have to be provided\n", "shape_type": "Shape", "color": "#b7dde8", "mp_name": "Decision", "reverse_engineering_type": "Termination Node", "x": 20.13306614173229, "y": 9.89711338582677}, "1133": {"id": "1133", "label": "Information to data subjects must be provided\n", "shape_type": "Shape", "color": "#b7dde8", "mp_name": "Decision", "reverse_engineering_type": "Termination Node", "x": 22.57556614173228, "y": 9.897213385826774}, "1138": {"id": "1138", "label": "Does any of the following apply?\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 27.94956614173228, "y": 13.00922677165355}, "1143": {"id": "1143", "label": "The data subject already has information about data processing\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 24.38186614173227, "y": 9.550426771653541}, "1144": {"id": "1144", "label": "Provision of such information proves impossible or would involve a disproportionate effort or in so far as the provision of information is likely to render impossible or seriously impair the achievement of the objectives of that processing. You have also taken appropriate measures to protect the data subject's rights and freedoms and legitimate interests, including making the information publicly available\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 26.35446614173227, "y": 9.143926771653547}, "1145": {"id": "1145", "label": "Obtaining or disclosure is expressly laid down by the EU or national law to which the controller is subject and which provides appropriate measures to protect the data subject's legitimate interests\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 28.78736614173226, "y": 9.897226771653543}, "1148": {"id": "1148", "label": "Where the personal data must remain confidential subject to an obligation of professional secrecy regulated by the EU or national law, including a statutory obligation of secrecy\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 31.4828661417323, "y": 9.832226771653545}, "1156": {"id": "1156", "label": "Yes\n", "shape_type": "Shape", "color": "#9dbb61", "mp_name": "Process", "reverse_engineering_type": "Yes Node", "x": 26.49299920902215, "y": 5.74091829929349}, "1157": {"id": "1157", "label": "No\n", "shape_type": "Shape", "color": "#c05046", "mp_name": "Process", "reverse_engineering_type": "No Node", "x": 29.40599920902213, "y": 5.74091829929349}, "1158": {"id": "1158", "label": "IF\n", "shape_type": "Shape", "color": "#eeeaf2", "mp_name": "Start/End", "reverse_engineering_type": "IF collector node", "x": 27.94949920902212, "y": 5.741018299293494}, "1166": {"id": "1166", "label": "Information to data subjects must be provided\n", "shape_type": "Shape", "color": "#b7dde8", "mp_name": "Decision", "reverse_engineering_type": "Termination Node", "x": 29.38454921259842, "y": 4.406676771653544}, "1167": {"id": "1167", "label": "Information to data subjects does not have to be provided\n", "shape_type": "Shape", "color": "#b7dde8", "mp_name": "Decision", "reverse_engineering_type": "Termination Node", "x": 26.49286614173226, "y": 4.445813385826774}, "1171": {"id": "1171", "label": "Can the provision of requested data adversely affect the rights and freedoms of others?\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 36.04676614173231, "y": 15.38412677165355}, "1173": {"id": "1173", "label": "No\n", "shape_type": "Shape", "color": "#c05046", "mp_name": "Process", "reverse_engineering_type": "No Node", "x": 36.8493492108103, "y": 14.13788725410232}, "1174": {"id": "1174", "label": "Yes\n", "shape_type": "Shape", "color": "#9dbb61", "mp_name": "Process", "reverse_engineering_type": "Yes Node", "x": 35.35944920723399, "y": 14.13796628920477}, "1177": {"id": "1177", "label": "Information to data subjects must not be provided\n", "shape_type": "Shape", "color": "#b7dde8", "mp_name": "Decision", "reverse_engineering_type": "Termination Node", "x": 34.1689, "y": 12.74811338582678}, "1178": {"id": "1178", "label": "Information to data subjects must be provided\n", "shape_type": "Shape", "color": "#e5b9b5", "mp_name": "Decision", "reverse_engineering_type": "Conditions to respect Node", "x": 37.8782661417323, "y": 12.66171338582677}, "1181": {"id": "1181", "label": "The data subject shall have the right to obtain from the controller without undue delay the rectification of inaccurate personal data concerning them. Taking into account the purposes of the processing, the data subject shall have the right to have incomplete personal data completed, including by means of providing a supplementary statement.\n", "shape_type": "Shape", "color": "#f2f2f2", "mp_name": "Custom 4", "reverse_engineering_type": "unknown", "x": 41.4742661417323, "y": 15.13932677165355}, "1184": {"id": "1184", "label": "the personal data are no longer necessary in relation to the purposes for which they were collected or otherwise processed\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 44.2883, "y": 13.05532677165355}, "1185": {"id": "1185", "label": "Does any of the following apply?\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 49.36736614173231, "y": 14.78782677165354}, "1188": {"id": "1188", "label": "the data subject withdraws consent and there is no other legal ground for the processing\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 46.58066614173229, "y": 13.05531338582677}, "1189": {"id": "1189", "label": "\nthe data subject objects to the processing\n\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 48.1211661417323, "y": 12.96411338582678}, "1190": {"id": "1190", "label": "\nthe personal data have been unlawfully processed\n\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 49.9150661417323, "y": 12.96411338582678}, "1191": {"id": "1191", "label": "\nthe personal data have to be erased for compliance with a legal obligation in EU or national law to which you are a subject\n\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 52.05276614173229, "y": 12.96412677165355}, "1192": {"id": "1192", "label": "\nthe personal data have been collected in relation to the offer of information society services to a child\n\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 54.29546614173231, "y": 12.96402677165354}, "1199": {"id": "1199", "label": "Yes\n", "shape_type": "Shape", "color": "#9dbb61", "mp_name": "Process", "reverse_engineering_type": "Yes Node", "x": 47.686, "y": 10.63262677165354}, "1200": {"id": "1200", "label": "No\n", "shape_type": "Shape", "color": "#c05046", "mp_name": "Process", "reverse_engineering_type": "No Node", "x": 50.8618, "y": 10.63262677165354}, "1201": {"id": "1201", "label": "IF\n", "shape_type": "Shape", "color": "#eeeaf2", "mp_name": "Start/End", "reverse_engineering_type": "IF collector node", "x": 49.3674, "y": 10.63262677165354}, "1218": {"id": "1218", "label": "Requested data must be deleted\n", "shape_type": "Shape", "color": "#e5b9b5", "mp_name": "Decision", "reverse_engineering_type": "Conditions to respect Node", "x": 46.1665661417323, "y": 4.42171338582677}, "1220": {"id": "1220", "label": "Is the further processing necessary:\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 47.6986, "y": 9.468526771653544}, "1222": {"id": "1222", "label": "for exercising the right of freedom of expression and information\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 43.17606614173229, "y": 7.422213385826773}, "1223": {"id": "1223", "label": "to comply with legal obligations under EU or national law, or to carry out a task in the public interest or under official authority granted to you.\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 45.4391661417323, "y": 7.428813385826771}, "1224": {"id": "1224", "label": "\nfor reasons of public interest in the area of public health\n\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 47.7005661417323, "y": 7.428713385826775}, "1225": {"id": "1225", "label": "\nfor archiving purposes in the public interest, scientific or historical research purposes or statistical purposes\n\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 49.7045661417323, "y": 7.428613385826772}, "1226": {"id": "1226", "label": "\nfor the establishment, exercise or defence of legal claims.\n\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 51.70866614173229, "y": 7.428613385826772}, "1239": {"id": "1239", "label": "IF\n", "shape_type": "Shape", "color": "#eeeaf2", "mp_name": "Start/End", "reverse_engineering_type": "IF collector node", "x": 47.750849207234, "y": 5.667526767361999}, "1251": {"id": "1251", "label": "Does any of the following apply?\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 61.2838661417323, "y": 16.10041338582678}, "1253": {"id": "1253", "label": "The accuracy of the personal data is contested by the data subject, for a period enabling you to verify the accuracy of the personal data\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 57.0474661417323, "y": 13.51851338582677}, "1254": {"id": "1254", "label": "The processing is unlawful and the data subject opposes the erasure of the personal data and requests the restriction of their use instead\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 59.7927661417323, "y": 13.48021338582677}, "1255": {"id": "1255", "label": "You no longer need the personal data for the purposes of the processing, but they are required by the data subject for the establishment, exercise or defence of legal claims\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 63.0064661417323, "y": 13.44451338582677}, "1256": {"id": "1256", "label": "The data subject has objected to processing pending the verification whether your legitimate grounds of override those of the data subject.\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 66.03696614173231, "y": 13.45251338582678}, "1264": {"id": "1264", "label": "Yes\n", "shape_type": "Shape", "color": "#9dbb61", "mp_name": "Process", "reverse_engineering_type": "Yes Node", "x": 60.58676614173232, "y": 11.66171338582677}, "1265": {"id": "1265", "label": "No\n", "shape_type": "Shape", "color": "#c05046", "mp_name": "Process", "reverse_engineering_type": "No Node", "x": 62.67906614173231, "y": 11.64281338582678}, "1266": {"id": "1266", "label": "IF\n", "shape_type": "Shape", "color": "#eeeaf2", "mp_name": "Start/End", "reverse_engineering_type": "IF collector node", "x": 61.63286614173232, "y": 11.66181338582678}, "1273": {"id": "1273", "label": "Requested processing must be restricted\n", "shape_type": "Shape", "color": "#e5b9b5", "mp_name": "Decision", "reverse_engineering_type": "Conditions to respect Node", "x": 60.58676614173232, "y": 10.33331338582678}, "1275": {"id": "1275", "label": "Requested processing does not have to be restricted\n", "shape_type": "Shape", "color": "#b7dde8", "mp_name": "Decision", "reverse_engineering_type": "Termination Node", "x": 62.6791161417323, "y": 10.33341338582678}, "1277": {"id": "1277", "label": "If you restrict processing, you may only store the data and otherwise process it only with the data subject\u2019s consent, for legal claims, to protect others\u2019 rights or for important public interest under the EU or national law.\n", "shape_type": "Shape", "color": "#f2f2f2", "mp_name": "Custom 4", "reverse_engineering_type": "unknown", "x": 60.58676614173232, "y": 8.106413385826777}, "1279": {"id": "1279", "label": "You also need to inform data subject before the restriction is lifted\n", "shape_type": "Shape", "color": "#f2f2f2", "mp_name": "Custom 4", "reverse_engineering_type": "unknown", "x": 60.58666614173232, "y": 5.776913385826774}, "1282": {"id": "1282", "label": "The processing:\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 71.66476614173229, "y": 16.10231338582678}, "1283": {"id": "1283", "label": "Is based on consent or contract\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 70.64246614173229, "y": 14.90031338582678}, "1284": {"id": "1284", "label": "\u00a0is carried out by automated means\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 72.68696614173228, "y": 14.90031338582678}, "1289": {"id": "1289", "label": "Yes\n", "shape_type": "Shape", "color": "#9dbb61", "mp_name": "Process", "reverse_engineering_type": "Yes Node", "x": 70.3790661417323, "y": 13.47981338582678}, "1290": {"id": "1290", "label": "No\n", "shape_type": "Shape", "color": "#c05046", "mp_name": "Process", "reverse_engineering_type": "No Node", "x": 72.69669921259839, "y": 13.47172677165354}, "1291": {"id": "1291", "label": "IF\n", "shape_type": "Shape", "color": "#eeeaf2", "mp_name": "Start/End", "reverse_engineering_type": "IF collector node", "x": 71.6647355151012, "y": 13.47980568673327}, "1298": {"id": "1298", "label": "Can the provision of requested data adversely affect the rights and freedoms of others?\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 70.3790661417323, "y": 12.25861338582678}, "1300": {"id": "1300", "label": "No\n", "shape_type": "Shape", "color": "#c05046", "mp_name": "Process", "reverse_engineering_type": "No Node", "x": 71.82326614173229, "y": 11.14561338582677}, "1301": {"id": "1301", "label": "Yes\n", "shape_type": "Shape", "color": "#9dbb61", "mp_name": "Process", "reverse_engineering_type": "Yes Node", "x": 68.97774920723401, "y": 11.12819975474604}, "1304": {"id": "1304", "label": "Information to data subjects cannot to be provided\n", "shape_type": "Shape", "color": "#b7dde8", "mp_name": "Decision", "reverse_engineering_type": "Termination Node", "x": 68.9777661417323, "y": 9.475313385826773}, "1309": {"id": "1309", "label": "Information to data subjects does not have to be provided\n", "shape_type": "Shape", "color": "#b7dde8", "mp_name": "Decision", "reverse_engineering_type": "Termination Node", "x": 72.68686614173231, "y": 12.10861338582676}, "1311": {"id": "1311", "label": "Information to data subjects must be provided\n", "shape_type": "Shape", "color": "#e5b9b5", "mp_name": "Decision", "reverse_engineering_type": "Conditions to respect Node", "x": 71.8233661417323, "y": 9.512813385826774}, "1314": {"id": "1314", "label": "\u00a0Data subject shall have the right to have the personal data transmitted directly from one controller to another, where technically feasible.\n", "shape_type": "Shape", "color": "#f2f2f2", "mp_name": "Custom 4", "reverse_engineering_type": "unknown", "x": 71.8233661417323, "y": 7.527613385826776}, "1316": {"id": "1316", "label": "The data subject can object at any time, based on their particular situation, to your processing carried out for public interest/official authority or your legitimate interests, including profiling. You must stop processing unless you demonstrate compelling overriding grounds or it is necessary for legal claims.\n", "shape_type": "Shape", "color": "#f2f2f2", "mp_name": "Custom 4", "reverse_engineering_type": "unknown", "x": 77.6764661417323, "y": 15.26451338582678}, "1319": {"id": "1319", "label": "Is the automated decision:\n", "shape_type": "Shape", "color": "#fff2cc", "mp_name": "Process", "reverse_engineering_type": "Question Node", "x": 83.67606614173229, "y": 13.97112677165355}, "1321": {"id": "1321", "label": " necessary for entering into, or performance of, a contract between the data subject and a data controller?\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 80.9041661417323, "y": 12.00742677165354}, "1322": {"id": "1322", "label": "authorised by the EU or national law to which you are the subject and which also lays down suitable measures to safeguard the data subject's rights and freedoms and legitimate interests?\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 83.67606614173229, "y": 11.83377677165355}, "1323": {"id": "1323", "label": "based on the data subject's explicit consent?\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 86.8125661417323, "y": 12.09432677165354}, "1330": {"id": "1330", "label": "Yes\n", "shape_type": "Shape", "color": "#9dbb61", "mp_name": "Process", "reverse_engineering_type": "Yes Node", "x": 82.6463661417323, "y": 9.372426771653544}, "1331": {"id": "1331", "label": "No\n", "shape_type": "Shape", "color": "#c05046", "mp_name": "Process", "reverse_engineering_type": "No Node", "x": 84.61066614173231, "y": 9.364326771653545}, "1332": {"id": "1332", "label": "IF\n", "shape_type": "Shape", "color": "#eeeaf2", "mp_name": "Start/End", "reverse_engineering_type": "IF collector node", "x": 83.67606614173229, "y": 10.13052677165354}, "1338": {"id": "1338", "label": "\u00a0The right not to be subject to a decision based solely on automated processing does not apply\n", "shape_type": "Shape", "color": "#b7dde8", "mp_name": "Decision", "reverse_engineering_type": "Termination Node", "x": 81.8045661417323, "y": 7.226026771653544}, "1340": {"id": "1340", "label": "\u00a0The right not to be subject to a decision based solely on automated processing applies\n", "shape_type": "Shape", "color": "#b7dde8", "mp_name": "Decision", "reverse_engineering_type": "Termination Node", "x": 85.56556614173229, "y": 6.987426771653546}, "1385": {"id": "1385", "label": "Ensure that the following conditions are respected:\n", "shape_type": "Shape", "color": "#e5b9b5", "mp_name": "Process", "reverse_engineering_type": "Conditions to respect Node", "x": 105.2314661417323, "y": 46.38271338582678}, "1388": {"id": "1388", "label": "Ability to demonstrate that the data subject has consented to the processing of their data\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 100.8030661417323, "y": 47.88101338582678}, "1390": {"id": "1390", "label": "In case the data subject was called to provide consent in the context of a written declaration concerning other matters, ability to demonstrate that the request for consent was presented:\n- in a manner clearly distinguishable from other matters\n- in an intelligible and easily accessible form\n- using clear and plain language\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 100.8030661417323, "y": 46.38281338582677}, "1395": {"id": "1395", "label": "Possibility for the data subject to\u00a0withdraw\u00a0their consent\u00a0at any given moment\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 100.8032661417323, "y": 44.75961338582678}, "1400": {"id": "1400", "label": "Consent is\u00a0freely given, specific, informed and unambiguous\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 100.8031661417323, "y": 48.87921338582677}, "1412": {"id": "1412", "label": "Requested data should not be deleted\n", "shape_type": "Shape", "color": "#b7dde8", "mp_name": "Decision", "reverse_engineering_type": "Termination Node", "x": 53.2395, "y": 10.63262677165354}, "1430": {"id": "1430", "label": "Re freely given element, consider (among other elements)  providing consent to the processing of personal data not necessary for the performance of a contract, was a condition for the performance of said contract\u00a0\u00a0\n", "shape_type": "Shape", "color": "#f2f2f2", "mp_name": "Data", "reverse_engineering_type": "unknown", "x": 95.86686614173229, "y": 48.74771338582679}, "1416": {"id": "1416", "label": "No\n", "shape_type": "Shape", "color": "#c05046", "mp_name": "Process", "reverse_engineering_type": "No Node", "x": 46.1665661417323, "y": 5.67771338582677}, "1417": {"id": "1417", "label": "Yes\n", "shape_type": "Shape", "color": "#9dbb61", "mp_name": "Process", "reverse_engineering_type": "Yes Node", "x": 49.335066138156, "y": 5.667513385826773}, "1432": {"id": "1432", "label": "Is the data subject above\u00a016 years old?\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 109.5260661417323, "y": 48.74781338582677}, "1436": {"id": "1436", "label": "Yes\n", "shape_type": "Shape", "color": "#9dbb61", "mp_name": "Process", "reverse_engineering_type": "Yes Node", "x": 108.1036661417323, "y": 46.75821338582677}, "1438": {"id": "1438", "label": "No\n", "shape_type": "Shape", "color": "#c05046", "mp_name": "Process", "reverse_engineering_type": "No Node", "x": 110.4113661417323, "y": 47.08101338582677}, "1441": {"id": "1441", "label": "Is consent given or authorised by the holder of parental responsibility over the child?\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 111.1379661417323, "y": 45.73971338582678}, "1444": {"id": "1444", "label": "No\n", "shape_type": "Shape", "color": "#c05046", "mp_name": "Process", "reverse_engineering_type": "No Node", "x": 110.2395661417323, "y": 44.33291338582679}, "1447": {"id": "1447", "label": "Data cannot be processed\n", "shape_type": "Shape", "color": "#b7dde8", "mp_name": "Decision", "reverse_engineering_type": "Termination Node", "x": 110.2396330708662, "y": 42.81068661417324}, "1744": {"id": "1744", "label": "Once it is established that data can be processed lawfully, all of the below must be ensured and complied with simultaneously\n", "shape_type": "Shape", "color": "#fff2cc", "mp_name": "Process", "reverse_engineering_type": "Question Node", "x": 115.0636330708661, "y": 37.34768661417322}, "1757": {"id": "1757", "label": "lawfulness, fairness and transparency\n\npersonal data shall be processed\u00a0\nprocessed lawfully, fairly and in a transparent manner in relation to the data subject\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 197.4707, "y": 57.9641}, "1758": {"id": "1758", "label": "purpose limitation\n\npersonal data shall be\ncollected for specified, explicit and legitimate purposes and not further processed in a manner that is incompatible with those purposes\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 197.4707, "y": 56.0082}, "1759": {"id": "1759", "label": "data minimisation\u00a0\n\npersonal data shall be\u00a0adequate, relevant and limited to what is necessary in relation to the purposes for which they are processed\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 197.4716, "y": 54.0522}, "1760": {"id": "1760", "label": "accuracy\n\npersonal data shall be\u00a0\naccurate and, where necessary, kept up to date; every reasonable step must be taken to ensure that personal data that are inaccurate, having regard to the purposes for which they are processed, are erased or rectified without delay\n\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 197.4717, "y": 51.7247}, "1761": {"id": "1761", "label": "storage limitation\u00a0\n\npersonal data shall be\u00a0\nkept in a form which permits identification of data subjects for no longer than is necessary for the purposes for which the personal data are processed\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 197.4707, "y": 49.3698}, "1762": {"id": "1762", "label": "integrity and confidentiality\n\npersonal data shall be\u00a0\nprocessed in a manner that ensures appropriate security of the personal data, including protection against unauthorised or unlawful processing and against accidental loss, destruction or damage, using appropriate technical or organisational measures\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 197.4712, "y": 46.9351}, "1763": {"id": "1763", "label": "accountability\u00a0\n\nthe controller shall be responsible for and be able to dermonstrate compliance with data protection principles\n", "shape_type": "Shape", "color": null, "mp_name": "Process", "reverse_engineering_type": "unknown", "x": 197.4706, "y": 44.4248}, "1764": {"id": "1764", "label": "STAGE 1. ESTABLISHING  EXISTENCE OF PERSONAL DATA, THE APPLICABILITY OF THE GDPR AND DATA PROCESSING ROLES\n", "shape_type": "Shape", "color": "#ffffff", "mp_name": "Unknown", "reverse_eng let state = { activeIds: [DATA.startId], checks: {} };

const isSimple    = n => n in DATA.simpleIfMap;
const isCollector = n => n in DATA.collectorIfMap;
const isDecision  = n => isSimple(n) || isCollector(n);
const isTerminal  = n => { const o = DATA.outgoing[n]; return !o || !o.length; };

function evalConds(id) {
    const ctx = DATA.collectorIfMap[id], ch = state.checks[id] || {};
    const orC = ctx.or_conditions || [], andC = ctx.and_conditions || [];
    if (!orC.length && !andC.length) return (ctx.conditions || []).some(c => ch[c]);
    return (!orC.length || orC.some(c => ch[c])) && (!andC.length || andC.every(c => ch[c]));
}

function stepAll() {
    const seen = new Set(), next = [];
    for (const nid of state.activeIds) {
        if (isDecision(nid) || isTerminal(nid)) {
            if (!seen.has(nid)) { next.push(nid); seen.add(nid); } continue;
        }
        const ns = (DATA.outgoing[nid] || []).map(e => e.to).filter(Boolean);
        for (const n of (ns.length ? ns : [nid])) if (!seen.has(n)) { next.push(n); seen.add(n); }
    }
    state.activeIds = next; render();
}

function answer(nodeId, choice) {
    const ctx = DATA.simpleIfMap[nodeId];
    const target = choice === 'yes' ? ctx.yes_node : ctx.no_node;
    const seen = new Set(), next = [];
    for (const nid of state.activeIds) {
        const dest = nid === nodeId ? target : nid;
        if (!seen.has(dest)) { next.push(dest); seen.add(dest); }
    }
    state.activeIds = next; render();
}

function resolveConditions(ifId) {
    const outputs = DATA.collectorIfMap[ifId].output_nodes || [];
    const seen = new Set(), next = [];
    for (const nid of state.activeIds)
        for (const t of (nid === ifId ? outputs : [nid]))
            if (!seen.has(t)) { next.push(t); seen.add(t); }
    state.activeIds = next; render();
}

function toggleCondition(ifId, condId) {
    if (!state.checks[ifId]) state.checks[ifId] = {};
    state.checks[ifId][condId] = !state.checks[ifId][condId];
    render();
}

function reset() { state = { activeIds: [DATA.startId], checks: {} }; render(); }

document.addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn || btn.hasAttribute('disabled')) return;
    const d = btn.dataset;
    if      (d.action === 'toggleCondition')   toggleCondition(d.ifid, d.condid);
    else if (d.action === 'answer')             answer(d.nodeid, d.choice);
    else if (d.action === 'resolveConditions') resolveConditions(d.ifid);
    else if (d.action === 'stepAll')            stepAll();
    else if (d.action === 'reset')              reset();
});

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildCard(nid) {
    const node = DATA.nodeMap[nid]; if (!node) return '';
    const label = esc((node.label || '').replace(/\n/g,' ').trim()) || '(no label)';
    const ntype = esc(node.reverse_engineering_type || 'unknown');
    const color = node.color || '#f0f0f0';
    let body = '';

    if (isCollector(nid)) {
        const ctx = DATA.collectorIfMap[nid];
        const orS  = new Set(ctx.or_conditions  || []);
        const andS = new Set(ctx.and_conditions || []);
        const ch   = state.checks[nid] || {};
        let items  = '';
        for (const cd of (ctx.condition_details || [])) {
            const cl  = esc((cd.label || '').replace(/\n/g,' ').trim());
            const tag = andS.has(cd.id) ? ' <b>[AND]</b>' : orS.has(cd.id) ? ' <b>[OR]</b>' : '';
            items += `<button class="citem${ch[cd.id] ? ' active' : ''}"
                data-action="toggleCondition" data-ifid="${nid}" data-condid="${cd.id}">${cl}${tag}</button>`;
        }
        const sat = evalConds(nid);
        body = `<div class="clist">${items}</div>
            <div class="status ${sat ? 'met' : 'unmet'}">${sat ? '&#10003; Conditions met' : '&#9675; Not yet met'}</div>
            <button class="btn btn-proceed"${sat ? '' : ' disabled'} data-action="resolveConditions" data-ifid="${nid}">Proceed &#8594;</button>`;

    } else if (isSimple(nid)) {
        body = `<div class="yesno">
            <button class="btn btn-yes" data-action="answer" data-nodeid="${nid}" data-choice="yes">Yes</button>
            <button class="btn btn-no"  data-action="answer" data-nodeid="${nid}" data-choice="no">No</button>
            </div>`;

    } else if (isTerminal(nid)) {
        body = '<div class="terminal">&#10003; Terminal</div>';
    }

    return `<div class="card" style="background:${color}">
        <div class="card-title">${label}</div>
        <div class="card-meta">${ntype} &middot; ID: ${nid}</div>
        ${body}</div>`;
}

function render() {
    const canAdv = state.activeIds.some(n => !isDecision(n) && !isTerminal(n));
    const done   = state.activeIds.length > 0 && state.activeIds.every(isTerminal);
    document.getElementById('cards').innerHTML =
        state.activeIds.map(buildCard).join('');
    document.getElementById('controls').innerHTML =
        (canAdv ? '<button class="btn btn-next" data-action="stepAll">Next &#8594;</button>' : '')
        + (done  ? '<span class="done">&#10003; All paths complete.</span>' : '')
        + '<button class="btn btn-restart" data-action="reset">&#8635; Restart</button>';
}

render();
</script>
</body>
</html>
